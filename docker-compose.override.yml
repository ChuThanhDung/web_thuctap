# Tiện ích cho môi trường dev; tự động nạp khi chạy `docker compose up`.
# Production phải chạy với `-f docker-compose.yml` để KHÔNG dùng file này.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Dữ liệu demo (chỉ nạp khi volume còn trống).
      - ./scripts/init_auth.sql:/docker-entrypoint-initdb.d/001_init_auth.sql:ro
      - ./scripts/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro

  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
      - ./invoice:/app/invoice

  frontend:
    build:
      args:
        # Bật trang mẫu giao diện /styleguide ở môi trường dev.
        VITE_STYLEGUIDE: "true"
