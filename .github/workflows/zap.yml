name: OWASP ZAP baseline

# Quét thụ động (baseline) bản đang chạy mỗi tuần: chỉ đọc trang và header, không tấn công, không đăng nhập.
# Kết quả là báo cáo tải về trong tab Actions; không làm hỏng CI hay chặn deploy.
on:
  schedule:
    - cron: "0 20 * * 0" # 3 giờ sáng thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://docusyncai.duckdns.org
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
