name: Deploy

# Sau khi CI trên nhánh main chạy thành công: build image backend + web (Caddy kèm file tĩnh frontend) trên GitHub
# Actions, đẩy lên GHCR, rồi SSH vào máy ảo GCP chạy update.sh để pull đúng image đó. Máy ảo không build
# (e2-micro 1 GB RAM sẽ hết bộ nhớ). CI lỗi thì không deploy, web giữ bản cũ.
# Cần 3 secret (Settings → Secrets and variables → Actions): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# Tùy chọn 1 variable (tab Variables): VITE_SENTRY_DSN để bật Sentry cho frontend.
# Xem deploy/gcp/README.md, mục "Tự động deploy khi push".
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # bấm tay trong tab Actions khi cần deploy lại

permissions:
  contents: read

# Không chạy hai lượt deploy cùng lúc; lượt mới chờ lượt cũ xong.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image names
        id: meta
        run: |
          # Tên image trên GHCR phải viết thường.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.registry }}/docusyncai-backend:${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.registry }}/docusyncai-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_RELEASE=${{ steps.meta.outputs.commit }}
          tags: |
            ${{ steps.meta.outputs.registry }}/docusyncai-web:${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.registry }}/docusyncai-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Gói miễn phí của GitHub Packages có hạn dung lượng: chỉ giữ 10 bản mới nhất (đủ để quay lại bản cũ).
      - name: Prune old backend images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: docusyncai-backend
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old web images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: docusyncai-web
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read # token tạm để máy ảo pull image private, hết hạn khi job xong
    steps:
      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Nhận khóa dạng PEM nhiều dòng hoặc base64 một dòng (dễ copy từ terminal trên trình duyệt).
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy
          fi
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null || { echo "DEPLOY_SSH_KEY không phải khóa hợp lệ"; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run update script on the VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMMIT: ${{ needs.build.outputs.commit }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Token đi qua stdin (không nằm trong dòng lệnh trên máy ảo); update.sh chỉ đọc nó khi có GHCR_TOKEN_STDIN=1.
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "GHCR_TOKEN_STDIN=1 /opt/docusyncai/deploy/gcp/update.sh $COMMIT"
