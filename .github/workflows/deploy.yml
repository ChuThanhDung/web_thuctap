name: Backend, Frontend and CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/p-007-backend
  FRONTEND_IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/p-007-frontend

jobs:
  backend-ci:
    name: CI / Backend lint and tests
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir pip setuptools wheel
          for attempt in 1 2 3 4 5; do
            python -m pip install --no-cache-dir --retries 20 --timeout 240 --prefer-binary --progress-bar off -r requirements.txt && break
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Lint backend
        run: ruff check src/ tests/

      - name: Start clean test Postgres DB
        run: |
          python -c "
          import os, subprocess, time

          env = os.environ.copy()
          env.update({
              'COMPOSE_PROJECT_NAME': 'docusyncai_ci',
              'POSTGRES_USER': 'admin',
              'POSTGRES_PASSWORD': 'Admin@123',
              'POSTGRES_DB': 'docusyncai',
              'POSTGRES_PORT': '55433',
          })

          subprocess.run(['docker', 'compose', 'down', '--volumes', '--remove-orphans'], env=env, check=False)
          subprocess.run(['docker', 'compose', 'up', '-d', 'postgres'], env=env, check=True)

          for _ in range(30):
              result = subprocess.run(
                  ['docker', 'compose', 'exec', '-T', 'postgres', 'pg_isready', '-U', 'admin', '-d', 'docusyncai'],
                  env=env,
                  check=False,
              )
              if result.returncode == 0:
                  break
              time.sleep(1)
          else:
              raise SystemExit('Postgres did not become ready in time')
          "

      - name: Test backend
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql+psycopg://admin:Admin%40123@localhost:55433/docusyncai

      - name: Stop test Postgres DB
        if: always()
        run: docker compose down --volumes --remove-orphans
        env:
          COMPOSE_PROJECT_NAME: docusyncai_ci
          POSTGRES_PORT: 55433

  frontend-ci:
    name: CI / Frontend build
    runs-on: self-hosted

    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache-${{ github.run_id }}
      VITE_API_BASE_URL: /api/v1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-backend:
    name: Deploy / Backend
    runs-on: self-hosted
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy / Frontend
    runs-on: self-hosted
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger frontend deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
