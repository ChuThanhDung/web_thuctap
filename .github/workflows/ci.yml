name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint and tests
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir pip setuptools wheel
          for attempt in 1 2 3 4 5; do
            python -m pip install --no-cache-dir --retries 20 --timeout 240 --prefer-binary --progress-bar off -r requirements.txt && break
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Lint backend
        run: ruff check src/ tests/

      - name: Start clean test Postgres DB
        run: |
          python -c "
          import os, socket, subprocess, time

          run_id = os.environ.get('GITHUB_RUN_ID', 'local')
          run_attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '1')
          project_name = f'docusyncai_ci_{run_id}_{run_attempt}'.lower()
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.bind(('127.0.0.1', 0))
              postgres_port = str(sock.getsockname()[1])

          github_env = os.environ.get('GITHUB_ENV')
          if github_env:
              with open(github_env, 'a', encoding='utf-8') as env_file:
                  env_file.write(f'COMPOSE_PROJECT_NAME={project_name}\n')
                  env_file.write(f'POSTGRES_PORT={postgres_port}\n')
                  env_file.write(
                      'DATABASE_URL='
                      f'postgresql+psycopg://admin:Admin%40123@localhost:{postgres_port}/docusyncai\n'
                  )

          env = os.environ.copy()
          env.update({
              'COMPOSE_PROJECT_NAME': project_name,
              'POSTGRES_USER': 'admin',
              'POSTGRES_PASSWORD': 'Admin@123',
              'POSTGRES_DB': 'docusyncai',
              'POSTGRES_PORT': postgres_port,
          })

          compose_file = '.github/docker-compose.ci.yml'
          subprocess.run(
              ['docker', 'compose', '-f', compose_file, 'down', '--volumes', '--remove-orphans'],
              env=env,
              check=False,
          )
          subprocess.run(['docker', 'compose', '-f', compose_file, 'up', '-d', 'postgres'], env=env, check=True)

          for _ in range(180):
              logs = subprocess.run(
                  ['docker', 'compose', '-f', compose_file, 'logs', '--no-color', 'postgres'],
                  env=env,
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if (
                  'PostgreSQL init process complete; ready for start up.' in logs.stdout
                  or 'database directory appears to contain a database; Skipping initialization' in logs.stdout
              ):
                  break
              time.sleep(1)
          else:
              subprocess.run(['docker', 'compose', '-f', compose_file, 'logs', '--no-color', 'postgres'], env=env, check=False)
              raise SystemExit('Postgres initialization did not complete in time')
          "

      - name: Wait for test database connection
        run: |
          python -c "
          import os, time
          import psycopg

          dsn = os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://')
          last_error = None
          consecutive_successes = 0

          for _ in range(90):
              try:
                  with psycopg.connect(dsn, connect_timeout=3) as conn:
                      with conn.cursor() as cur:
                          cur.execute('select 1')
                          cur.fetchone()
                  consecutive_successes += 1
                  if consecutive_successes >= 3:
                      break
              except Exception as exc:
                  last_error = exc
                  consecutive_successes = 0
                  time.sleep(2)
          else:
              raise SystemExit(f'Test database did not accept connections in time: {last_error}')
          "

      - name: Test backend
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Stop test Postgres DB
        if: always()
        run: docker compose -f .github/docker-compose.ci.yml down --volumes --remove-orphans

  frontend:
    name: Frontend build
    runs-on: self-hosted

    env:
      VITE_API_BASE_URL: /api/v1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-backend:
    name: Build image and deploy backend
    runs-on: self-hosted
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      BACKEND_IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/p-007-backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate backend deploy secrets
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in DOCKER_USERNAME DOCKER_PASSWORD RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Build and deploy frontend
    runs-on: self-hosted
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate frontend deploy secrets
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Reset npm exec cache
        shell: bash
        run: rm -rf "$NPM_CONFIG_CACHE/_npx"

      - name: Pull Vercel environment
        working-directory: frontend
        run: npm exec --yes --package=vercel -- vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm exec --yes --package=vercel -- vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend
        working-directory: frontend
        run: npm exec --yes --package=vercel -- vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
