name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Start Postgres DB Container
        run: |
          docker compose up -d postgres
          python -c "import time, socket; [time.sleep(1) for _ in range(15) if socket.socket().connect_ex(('127.0.0.1', 5432)) != 0]"

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql+psycopg://admin:Admin%40123@localhost:5432/docusyncai
