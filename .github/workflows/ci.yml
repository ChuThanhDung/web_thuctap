name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: Admin@123
          POSTGRES_DB: docusyncai
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-avatar.txt

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg://admin:Admin%40123@127.0.0.1:5433/docusyncai
          OPENAI_API_KEY: ""
        run: pytest tests/ -v
