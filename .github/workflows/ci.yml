name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quyền tối thiểu: CI chỉ đọc mã nguồn, không ghi gì vào repo và không dùng secret nào.
permissions:
  contents: read

# Push mới hủy lượt chạy cũ cùng nhánh để không lãng phí phút chạy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Migrations and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: Admin@123 # DB tạm của runner, không mở ra ngoài
          POSTGRES_DB: docusyncai
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://admin:Admin%40123@127.0.0.1:5433/docusyncai
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-avatar.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check src/ tests/ migrations/ scripts/ eval/

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run Pytest with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=75

      - name: Evaluate XML reconciliation pipeline on dataset
        run: python eval/run_eval.py --min-verdict-accuracy 1.0

  frontend-checks:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-placeholder-password
      DOCKER_DATABASE_URL: postgresql+psycopg://admin:ci-placeholder-password@postgres:5432/docusyncai
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create empty env file for env_file reference
        run: touch .env

      - name: Validate production and development compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose config -q
          docker compose -f docker-compose.yml --profile https config -q
