name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Start clean test Postgres DB
        run: |
          python -c "
          import os, subprocess, time

          env = os.environ.copy()
          env.update({
              'COMPOSE_PROJECT_NAME': 'docusyncai_ci',
              'POSTGRES_USER': 'admin',
              'POSTGRES_PASSWORD': 'Admin@123',
              'POSTGRES_DB': 'docusyncai',
              'POSTGRES_PORT': '55433',
          })

          subprocess.run(['docker', 'compose', 'down', '--volumes', '--remove-orphans'], env=env, check=False)
          subprocess.run(['docker', 'compose', 'up', '-d', 'postgres'], env=env, check=True)

          for _ in range(30):
              result = subprocess.run(
                  ['docker', 'compose', 'exec', '-T', 'postgres', 'pg_isready', '-U', 'admin', '-d', 'docusyncai'],
                  env=env,
                  check=False,
              )
              if result.returncode == 0:
                  break
              time.sleep(1)
          else:
              raise SystemExit('Postgres did not become ready in time')
          "

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql+psycopg://admin:Admin%40123@localhost:55433/docusyncai

      - name: Stop test Postgres DB
        if: always()
        run: docker compose down --volumes --remove-orphans
        env:
          COMPOSE_PROJECT_NAME: docusyncai_ci
          POSTGRES_PORT: 55433
