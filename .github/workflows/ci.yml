name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Ensure Postgres DB is available
        run: |
          python -c "
          import socket, subprocess, time
          sock = socket.socket()
          if sock.connect_ex(('127.0.0.1', 5432)) != 0:
              print('Port 5432 is closed. Starting Postgres container...')
              subprocess.run(['docker', 'compose', 'up', '-d', 'postgres'], check=True)
              for _ in range(15):
                  time.sleep(1)
                  s = socket.socket()
                  if s.connect_ex(('127.0.0.1', 5432)) == 0:
                      s.close()
                      break
                  s.close()
          else:
              print('Port 5432 is already open! Using existing PostgreSQL instance.')
          sock.close()
          "

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql+psycopg://admin:Admin%40123@localhost:5432/docusyncai
